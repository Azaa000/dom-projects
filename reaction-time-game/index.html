<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
        <div class="-w[576px] h-[576px] rounded-[24px] border p-[32px] border-[#27272A] bg-[#18181B] flex gap-[20px] flex-col">
          <div class="w-[159px] h-[29px] text-[24px] text-[#F4F4F5] font-semibold tracking-[0]">Reaction time</div>
          <div class="w-[313px] h-[24px] font-normal text-[14px] tracking-[0] text-[#A1A1AA]">Wait for green, then click as quickly as you can.</div>
          <div id="click-red" class="w-[512px] h-[256px] rounded-[16px] flex gap-[12px] bg-[#27272A] flex-col justify-center items-center" >
            <div class="w-[48px] h-[48px] rounded-full border-[2px] border-[#F4F4F5] flex justify-center items-center">
              <div class="w-[22px] h-[22px] rounded-full border border-[2px] border-[#F4F4F5] flex items-center justify-center">
                <div class="w-[6px] h-[6px] rounded-full border-[2px] border-[#F4F4F5] bg-[#F4F4F5]"></div>
              </div>
            </div>
            <div class="w-[234px] h-[29px] text-[24px] text-[24px] font-semibold text-[#f4f4f5]">Ready when you are</div>
            <div class="w-[85px] h-[17px] text-[14px] font-normal tracking-[0] text-[#f4f4f5]">Click to start</div>
          </div>
          <div class="w-[512px] h-[84px] flex gap-[12px]">
            <div class="w-[250px] h-[84px] rounded-xl flex gap-[4px] bg-[#27272A] flex-col justify-center items-center">
              <div id="last-ms" class="w-[24px] h-[29px] items-center flex font-normal text-[24px] text-[#D9F99D]">—</div>
              <div class="w-[73px] h-[15px] font-normal text-[12px] text-[#A1A1AA]">Last attempt</div>
            </div>
            <div class="w-[250px] h-[84px] rounded-xl flex gap-[4px] bg-[#27272A] flex-col justify-center items-center">
              <div id="best-ms" class="w-[24px] h-[29px] items-center flex font-normal text-[24px] text-[#D9F99D]">—</div>
              <div class="w-[96px] h-[15px] font-normal text-[12px] text-[#A1A1AA]">Best this session</div>
            </div>
          </div>
          <div class="w-[512px] h-[40px] font-normal text-[12px] text-[#A1A1AA] text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</div>
        </div>
      </div>
    </div>
  </body>
</html>
