<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Analog Clock · A moment in time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body
    class="relative isolate min-h-screen min-w-[1000px] bg-[#f5f3ee] font-sans text-[#253b35] antialiased selection:bg-[#dbe4d6]"
  >
    <div
      class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_50%_45%,#ffffff_0%,#f5f3ee_65%)]"
    ></div>
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#253b35]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#253b35]/10 bg-white/60 px-4 py-2.5 text-xs font-medium text-[#52675c] transition-colors hover:border-[#253b35]/25 hover:bg-white hover:text-[#253b35] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#52675c]"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#748174]"
          >The everyday collection / 05</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="w-screen h-[960px] bg-[#F5F3EE] flex justify-center items-center"
        >
          <div class="w-[392px] h-[439px] flex flex-col items-center">
            <div
              class="h-[15px] fonst-semibold text-[12px] text-[#7B887C] tracking-[3.5px] mb-[20px]"
            >
              A MOMENT IN TIME
            </div>
            <div class="text-[30px] text-[#253B35]">
              A quieter way to keep time.
            </div>
            <div class="text-[12px] text-[#7B887C] m-[20px]">
              Slow down. Let the seconds find their rhythm.
            </div>
            <div
              class="relative w-[392px] h-[392px] rounded-[196px] border-[#E9E7DF] aspect-square border bg-gradient-to-br flex justify-center items-center shadow-xl/20 bg-[#E9E7DF] border-[#D8DBD1] mt-[px]"
            >
              <div
                id="clock"
                class="relative aspect-square w-[360px] h-[360px] rounded-full border border-[#D8DBD1] bg-[#FCFBF7] flex justify-center items-center"
              >
                <div id="markers" class="absolute inset-0"></div>
                <div
                  id="numbers"
                  class="absolute inset-0 font-serif text-xl sm:text-2xl"
                ></div>
                <p
                  class="absolute left-1/2 top-[32%] -translate-x-1/2 text-[9px] fonst-semibold uppercase tracking-[3px]"
                >
                  SWISS
                </p>
                <div
                  id="hour"
                  class="absolute bottom-1/2 left-1/2 z-10 h-[27%] w-[7px] origin-bottom -translate-x-1/2 border rounded-xl bg-[#253B35]"
                ></div>
                <div
                  id="minute"
                  class="absolute bottom-1/2 left-1/2 z-20 h-[34%] w-[4px] origin-bottom -translate-x-1/2 border rounded-xl bg-[#253B35]"
                ></div>
                <div
                  id="second"
                  class="absolute bottom-1/2 left-1/2 z-30 h-[39%] w-[2px] origin-bottom -translate-x-1/2 border rounded-xl bg-[#C47E57] border-[#C47E57]"
                >
                  <span
                    class="absolute top-full h-6 w-full border-[#C47E57] border -translate-x-1/2"
                  ></span>
                </div>
                <div
                  class="absolute left-1/2 top-1/2 z-40 size-3 -translate-x-1/2 -translate-y-1/2 border-[4px] border-[#FCFBF7] w-[12px] h-[12px] bg-[#C47E57] rounded-full"
                ></div>
              </div>
            </div>
            <div
              class="mt-8 flex items-center gap-2 rounded-full border border-[#253b35]/10"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <footer
      class="flex h-16 shrink-0 items-center justify-between border-t border-[#253b35]/10 text-[10px] text-[#748174]"
    >
      <span>Every second, thoughtfully measured.</span
      ><span class="font-mono tracking-[2px]">ANALOG / LIVE</span>
    </footer>
  </body>
</html>
